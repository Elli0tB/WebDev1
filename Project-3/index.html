<head>
    <title>Supercool website</title>
    <link rel="stylesheet" href="style.css">
    <script src="scripter.js" defer></script>

</head>

<body>
    <h1>Message Boardom</h1>
    <p> Do you ever just get board and wanna share that with the world?<br> Now you can with Message Boardom. The message board for the bored, just click the Request Messages button below! </p>
    <button id = "Message_Request" onclick = "fetchAPI('GET')">Request Messages</button>
    <ul id = "Message_Log" class ="styled-list">Message Log:</ul>
    
    <p id = "Message_Response_Text"> If just reading isnt up to snuff for you, feel free to upload your own messages</p>
    
    <label id = "Message_Upload_Lable" for = "Message_Upload ">Message Contents:</label>
    <textarea id="Message_Upload" rows="4" placeholder="What would you like to say?"></textarea>
    <button id = 'Message_Submit' onclick=" (() => {
        const message = document.getElementById('Message_Upload').value;
        fetchAPI('POST', message)
        document.getElementById('Message_Upload').value = ''
        })()">Submit</button>
</body>
